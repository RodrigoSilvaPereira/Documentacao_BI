name: Release Tauri App

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Node ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bi-documentation-studio/package-lock.json

      # ---------------- Rust ----------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bi-documentation-studio/src-tauri -> target

      # ---------------- Install dependencies ----------------
      - name: Install frontend dependencies
        working-directory: bi-documentation-studio
        run: npm install

      # ---------------- Build + Release ----------------
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: bi-documentation-studio
          tagName: ${{ github.ref_name }}
          releaseName: "BI Documentation Studio ${{ github.ref_name }}"
          releaseBody: "Veja o changelog para detalhes desta versão."
          releaseDraft: true
          prerelease: false