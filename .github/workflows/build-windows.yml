name: Build Tauri Windows

on:
  push:
    branches:
      - "feat/platform-migration"

  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # ---------------- Repository ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Node.js ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bi-documentation-studio/package-lock.json

      # ---------------- Rust ----------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bi-documentation-studio/src-tauri -> target

      # ---------------- Dependencies ----------------
      - name: Install frontend dependencies
        working-directory: bi-documentation-studio
        run: npm ci

      # ---------------- Build ----------------
      - name: Build Tauri App
        working-directory: bi-documentation-studio
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # ---------------- Upload installers ----------------
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: bi-documentation-studio-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bi-documentation-studio/src-tauri/target/release/bundle/nsis/*.exe
            bi-documentation-studio/src-tauri/target/release/bundle/nsis/*.exe.sig
            bi-documentation-studio/src-tauri/target/release/bundle/msi/*.msi
            bi-documentation-studio/src-tauri/target/release/bundle/msi/*.msi.sig