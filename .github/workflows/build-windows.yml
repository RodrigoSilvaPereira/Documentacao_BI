name: Build Tauri Windows (.exe)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Node ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bi-documentation-studio/package-lock.json

      # ---------------- Rust ----------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ---------------- Install dependencies ----------------
      - name: Install frontend dependencies
        working-directory: bi-documentation-studio
        run: npm install

      # ---------------- Force icon refresh ----------------
      - name: Clean Cargo cache
        working-directory: bi-documentation-studio/src-tauri
        run: cargo clean

      # ---------------- Build Tauri ----------------
      - name: Build Tauri App
        working-directory: bi-documentation-studio
        run: npm run tauri build

      # ---------------- Upload .exe ----------------
      - name: Upload artifacts (exe)
        uses: actions/upload-artifact@v4
        with:
          name: bi-documentation-studio-windows
          path: |
            bi-documentation-studio/src-tauri/target/release/bundle/nsis/*.exe
            bi-documentation-studio/src-tauri/target/release/bundle/msi/*.msi